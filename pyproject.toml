[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-research-lab"
version = "0.1.0"
description = "PAPER/DEMO prediction-market research lab (no live trading)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Szlatkovszky Árpád" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
research-lab = "research_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["research_lab*"]

[tool.setuptools.package-data]
research_lab = ["schemas/*.json", "fixtures/*.json", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: optional live GET probe (disabled unless POLYMARKET_ALLOW_NETWORK=1)",
]
